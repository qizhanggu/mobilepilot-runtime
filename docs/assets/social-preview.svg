<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MobilePilot social preview</title><desc id="desc">MobilePilot, an auditable Android GUI Agent Runtime, with frozen paired evaluation and recovery metrics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset=".55" stop-color="#172554"/><stop offset="1" stop-color="#312E81"/></linearGradient><radialGradient id="glow"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><style>.brand{font:800 66px Inter,Segoe UI,sans-serif;fill:#F8FAFC;letter-spacing:-2px}.sub{font:500 25px Inter,Segoe UI,sans-serif;fill:#CBD5E1}.flow{font:700 19px Inter,Segoe UI,sans-serif;fill:#67E8F9}.num{font:800 38px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.label{font:600 15px Inter,Segoe UI,sans-serif;fill:#94A3B8}.scope{font:500 14px Inter,Segoe UI,sans-serif;fill:#94A3B8}</style></defs>
  <rect width="1280" height="640" fill="url(#bg)"/><circle cx="1060" cy="90" r="360" fill="url(#glow)"/><circle cx="1150" cy="520" r="240" fill="none" stroke="#818CF8" stroke-opacity=".18" stroke-width="2"/><circle cx="1150" cy="520" r="180" fill="none" stroke="#22D3EE" stroke-opacity=".16" stroke-width="2"/>
