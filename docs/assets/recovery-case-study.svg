  <text x="445" y="445" class="h">7 · Recovery #2</text><text x="445" y="480" class="t">blocked: previous Delete click</text><text x="445" y="503" class="t">Tree label: OK</text><text x="445" y="526" class="t">replan → CLICK OK</text>
  <text x="775" y="445" class="h">8 · Execute correction</text><text x="775" y="480" class="t">changed_action = true</text><text x="775" y="503" class="t">AndroidWorld click executed</text><text x="775" y="526" class="t">dialog disappears</text>
  <text x="1105" y="445" class="h">9 · Official success</text><text x="1105" y="480" class="t">official_reward = 1</text><text x="1105" y="503" class="t">rescued = true</text><rect x="1105" y="520" width="190" height="24" rx="12" fill="#0F766E"/><text x="1200" y="537" text-anchor="middle" class="k" fill="#CCFBF1">TRACE-STRICT RESCUE</text>
  <path class="a" d="M1438 315V362H550V397"/><path class="a" d="M685 482H737"/><path class="a" d="M1015 482H1067"/>
  <rect x="70" y="630" width="1460" height="48" rx="16" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="660" class="t">Evidence boundary: only Recovery #2 is counted as the strict rescue. The full chain and both outcomes remain in docs/final/audit/MarkorDeleteNewestNote--v2.2--hybrid.jsonl.</text>
