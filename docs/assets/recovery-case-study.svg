<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">MarkorDeleteNewestNote recovery case study</title>
  <desc id="desc">Trace-derived event chain: long press, repeated page, recovery, UI Tree finds Delete, click Delete, confirmation dialog, second recovery finds OK, official reward becomes one.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker><style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.sub{font:400 16px Inter,Segoe UI,sans-serif;fill:#94A3B8}.h{font:700 18px Inter,Segoe UI,sans-serif;fill:#F8FAFC}.t{font:400 13px Inter,Segoe UI,sans-serif;fill:#CBD5E1}.k{font:700 12px Inter,Segoe UI,sans-serif}.a{stroke:#94A3B8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" class="title">A real Recovery chain — MarkorDeleteNewestNote</text>
  <text x="70" y="100" class="sub">Rendered from the frozen JSONL Trace. No synthetic phone screens or inferred success.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="210" height="150" rx="20" fill="#1E293B" stroke="#64748B"/>
    <rect x="325" y="165" width="210" height="150" rx="20" fill="#3F1D2E" stroke="#FB7185"/>
    <rect x="580" y="165" width="210" height="150" rx="20" fill="#312E81" stroke="#818CF8"/>
    <rect x="835" y="165" width="210" height="150" rx="20" fill="#3B0764" stroke="#C084FC"/>
    <rect x="1090" y="165" width="210" height="150" rx="20" fill="#1E3A5F" stroke="#60A5FA"/>
    <rect x="1345" y="165" width="185" height="150" rx="20" fill="#422006" stroke="#F59E0B"/>
  </g>
  <text x="95" y="202" class="h">1 · LONG_PRESS</text><text x="95" y="237" class="t">Select newest note</text><text x="95" y="260" class="t">action executed</text>
  <text x="350" y="202" class="h">2 · Stuck signal</text><text x="350" y="237" class="t">revisited_same_screen</text><text x="350" y="260" class="t">reward still 0</text>
  <text x="605" y="202" class="h">3 · Recovery #1</text><text x="605" y="237" class="t">blocked: LONG_PRESS</text><text x="605" y="260" class="t">request UI Tree</text>
  <text x="860" y="202" class="h">4 · New evidence</text><text x="860" y="237" class="t">Tree label: Delete</text><text x="860" y="260" class="t">changed_action = true</text>
  <text x="1115" y="202" class="h">5 · CLICK Delete</text><text x="1115" y="237" class="t">confirmation dialog opens</text><text x="1115" y="260" class="t">first episode: not rescued</text>
  <text x="1370" y="202" class="h">6 · Stuck again</text><text x="1370" y="237" class="t">dialog awaits</text><text x="1370" y="260" class="t">explicit confirmation</text>
  <path class="a" d="M280 240H317"/><path class="a" d="M535 240H572"/><path class="a" d="M790 240H827"/><path class="a" d="M1045 240H1082"/><path class="a" d="M1300 240H1337"/>

  <g filter="url(#shadow)">
    <rect x="415" y="405" width="270" height="155" rx="22" fill="#312E81" stroke="#818CF8"/>
